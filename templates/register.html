{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="card auth-card">
        <h1>&#128222; Register</h1>
        <form method="post" action="{{ url_for('register') }}">
            <div class="field">
                <label>Username (min 3 characters)</label>
                <input type="text" name="username" required>
            </div>
            <div class="field">
                <label>Password (min 4 characters)</label>
                <input type="password" name="password" required>
            </div>
            <div class="field">
                <label>Confirm Password</label>
                <input type="password" name="confirm" required>
            </div>
            <button type="submit" class="btn btn-gold btn-block">Create Account</button>
        </form>
        <p class="muted">Already registered? <a href="{{ url_for('login') }}">Login here</a>.</p>
    </div>
</div>
{% endblock %}
